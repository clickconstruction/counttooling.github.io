name: CI

# push is main-only: with branches:['**'] every PR push ran the whole workflow
# TWICE (once for the push event, once for pull_request) — ~20 duplicate
# runner-minutes per push now that e2e is in the pipeline. Feature branches get
# CI through their PR; direct-to-branch pushes without a PR intentionally get
# none.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR obsoletes the in-flight run — cancel it. Never on
# main (punch row CI-MAIN, 2026-09-27): every push to main shares one group, so
# on a busy day each merge cancelled the run before it and twenty main runs in
# a row were cancelled without a verdict. Main's runs now queue: one runs, the
# newest pending one waits, and anything pending in between is replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint + unit tests + generated-artifact freshness (TOC / guides / SW hash).
      - run: npm run check

  # The full end-to-end suite. render-pixels runs here too — per-platform
  # baselines are committed (*-chromium-linux.png for CI; regeneration recipe
  # in playwright.config.js). The cloud-gated specs self-skip without
  # DEV_AUTH_* creds; no secrets are configured, and none are needed — the
  # local-only specs are the bulk of the suite and carried every regression
  # this repo has caught.
  #
  # Split four ways by FILE (fullyParallel is false in playwright.config.js, so
  # a spec file is the unit a shard takes), each shard on its own runner with
  # two workers. On one runner the suite took 42 to 49 minutes. The floor is
  # the longest file: tutorial.spec.js (about 558 s), then lessons.spec.js
  # (about 293 s). fail-fast is off so one red shard does not cancel the
  # other three and hide their failures.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # app/index.html loads /config.local.js on any localhost (dev-auth
      # overrides; gitignored). Without a file the 404 lands in the console and
      # every spec asserting a clean console fails — so stub it.
      - run: echo '// CI stub — real file is gitignored localhost dev-auth overrides' > config.local.js
      - run: npx playwright install --with-deps chromium
      # playwright.config.js starts its own webServer (npx serve -l 3456).
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per shard: upload-artifact v4 refuses a second upload
          # under a name already used in the run.
          name: playwright-error-contexts-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
