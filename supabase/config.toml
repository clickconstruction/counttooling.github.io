# Supabase local config (optional for Edge Functions deploy)
# Run: supabase link (to link to your project) then supabase functions deploy admin-create-user

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Admin Edge Functions validate JWT in-code via getUser(); gateway verification can reject valid tokens
[functions.admin-list-users]
verify_jwt = false
[functions.admin-create-user]
verify_jwt = false
[functions.admin-delete-user]
verify_jwt = false
[functions.admin-delete-project]
verify_jwt = false
[functions.admin-set-password]
verify_jwt = false
[functions.admin-reassign-projects]
verify_jwt = false

[functions.invite-to-project]
verify_jwt = false

[functions.get-view-project]
verify_jwt = false

[functions.set-view-scale]
verify_jwt = false

[functions.manage-user]
verify_jwt = false

[functions.twin-login]
verify_jwt = false

[auth]
enabled = true
# Twin magic-link mints must land on the deployed app (was unset -> localhost:3000 fallback,
# found during the 2026-08-28 two-app mint smoke). jwt_expiry and MFA mirror the remote
# values so config push only changes the URLs — do NOT trim these.
site_url = "https://counttooling.com"
additional_redirect_urls = ["https://counttooling.com/**"]
jwt_expiry = 36000

# Branded magic-link email (the sign-in fallback + twin mints). Sender identity
# (from-address) is custom SMTP, configured in the dashboard - the template is ours.
[auth.email.template.magic_link]
subject = "Sign in to CountTooling"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
